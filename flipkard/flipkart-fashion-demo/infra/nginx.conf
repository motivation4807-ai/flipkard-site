# Edge/reverse-proxy example. Replace upstream names with your service discovery targets.
worker_processes auto;
worker_rlimit_nofile 65535;

events { worker_connections 8192; multi_accept on; }

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_max_body_size 2m;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog_cache:64m max_size=2g inactive=10m use_temp_path=off;
  upstream next_frontends {
    least_conn;
    server storefront-web-1:3000 max_fails=3 fail_timeout=10s;
    server storefront-web-2:3000 max_fails=3 fail_timeout=10s;
    server storefront-web-3:3000 max_fails=3 fail_timeout=10s;
    keepalive 128;
  }

  server {
    listen 80 reuseport;
    server_name _;

    location ^~ /_next/static/ {
      proxy_pass http://next_frontends;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /products/ {
      proxy_pass http://next_frontends;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # Cache only the public product catalogue. Do not cache customer/order endpoints here.
    location ^~ /api/products {
      proxy_pass http://next_frontends;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache catalog_cache;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 30s;
      proxy_cache_use_stale error timeout http_500 http_502 http_503 updating;
      proxy_cache_background_update on;
      add_header X-Edge-Cache $upstream_cache_status always;
    }

    location / {
      proxy_pass http://next_frontends;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
